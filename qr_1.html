<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Here is what I'm telling you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;background:#111214;color:#fff;font-family:"DM Sans",sans-serif}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.glow{position:absolute;width:58vw;height:58vw;border-radius:50%;filter:blur(130px);opacity:.09}
.g1{top:-35%;left:-20%;background:#888}.g2{right:-22%;bottom:-40%;background:#666}
.wave{position:absolute;width:150%;height:52%;left:-25%;border-radius:50%;border-top:1px solid rgba(255,255,255,.025)}
.w1{top:-25%;transform:rotate(-6deg)}.w2{top:-20%;transform:rotate(-6deg) translateY(50px);opacity:.5}.w3{bottom:-28%;transform:rotate(6deg);opacity:.45}
.page{position:relative;height:100vh;width:100%;z-index:2}
.header{position:absolute;top:0;left:0;width:100%;height:92px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:"Manrope",sans-serif;font-size:.85rem;font-weight:500;letter-spacing:.12em;color:rgba(255,255,255,.75);background:rgba(20,21,23,.82);border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 15px 50px rgba(0,0,0,.3);backdrop-filter:blur(15px);z-index:5}
.header:before{content:"";position:absolute;inset:0;opacity:.18;background-image:radial-gradient(circle at 20% 50%,rgba(255,255,255,.15) 0 1px,transparent 1.5px),radial-gradient(circle at 70% 30%,rgba(255,255,255,.1) 0 1px,transparent 1.5px),radial-gradient(circle at 45% 80%,rgba(255,255,255,.08) 0 1px,transparent 1.5px);background-size:90px 90px,130px 130px,110px 110px}
.header span{position:relative;z-index:2}
.quote-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1500px,94vw);padding:15px;text-align:center;display:flex;justify-content:center}
.quote{font-family:"Manrope",sans-serif;font-size:90px;font-weight:500;line-height:1.08;letter-spacing:-.055em;color:#fff;text-shadow:0 0 35px rgba(255,255,255,.055),0 15px 50px rgba(0,0,0,.3);opacity:0;transition:opacity .65s ease}
.quote.visible{opacity:1}
.quote-line{display:block;white-space:nowrap}
.instagram{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 35px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(12px);text-decoration:none}
@media(max-width:600px){.header{height:76px;font-size:.72rem;letter-spacing:.08em}.quote-wrap{width:96vw;padding:8px}.instagram{bottom:22px;width:46px;height:46px}}
</style>
</head>
<body>
<div class="bg"><div class="glow g1"></div><div class="glow g2"></div><div class="wave w1"></div><div class="wave w2"></div><div class="wave w3"></div></div>
<main class="page">
<header class="header"><span>here is what I'm telling you</span></header>
<section class="quote-wrap"><div id="quote" class="quote"></div></section>
<a class="instagram" href="https://www.instagram.com/nomeutente" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
</main>
<script>
const PHRASE_FILE="frase1.txt";

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function renderPhrase(raw){
  const q=document.getElementById("quote");
  const lines=raw.trim().split(/<br\\s*\\/?>/i);
  q.innerHTML=lines.map(x=>`<span class="quote-line">${escapeHtml(x)}</span>`).join("");
  fit();
  requestAnimationFrame(()=>q.classList.add("visible"));
}
function fit(){
  const q=document.getElementById("quote");
  const wrap=document.querySelector(".quote-wrap");
  if(!q.children.length)return;
  let size=innerWidth<=600?54:90;
  const min=innerWidth<=600?22:30;
  const maxWidth=wrap.clientWidth*.94;
  q.style.fontSize=size+"px";
  while(size>min){
    const tooWide=[...q.children].some(el=>el.scrollWidth>maxWidth);
    if(!tooWide)break;
    size--;
    q.style.fontSize=size+"px";
  }
}
fetch(PHRASE_FILE,{cache:"no-store"})
 .then(r=>{if(!r.ok)throw new Error("File non trovato");return r.text()})
 .then(renderPhrase)
 .catch(()=>{document.getElementById("quote").textContent="Impossibile caricare la frase.";document.getElementById("quote").classList.add("visible")});
addEventListener("resize",fit);
</script>
</body>
</html>
