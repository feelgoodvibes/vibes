       RESET

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =========================
       PAGINA
    ========================= */

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;

      background: #111214;
      color: #ffffff;

      font-family: "DM Sans", sans-serif;

      position: relative;

      display: flex;
      flex-direction: column;
      align-items: center;
    }


    /* =========================
       SFONDO
    ========================= */

    .background-glow {
      position: absolute;
      inset: 0;

      overflow: hidden;

      pointer-events: none;
      z-index: 0;
    }

    .glow {
      position: absolute;

      width: 55vw;
      height: 55vw;

      border-radius: 50%;

      filter: blur(120px);

      opacity: 0.12;
    }

    .glow.one {
      top: -35%;
      left: -15%;

      background: #777777;
    }

    .glow.two {
      bottom: -40%;
      right: -15%;

      background: #555555;
    }


    /* Onde sottili */

    .wave {
      position: absolute;

      width: 150%;
      height: 50%;

      left: -25%;

      border-radius: 50%;

      border-top: 1px solid rgba(255, 255, 255, 0.035);

      pointer-events: none;
    }

    .wave.one {
      top: -27%;
      transform: rotate(-6deg);
    }

    .wave.two {
      top: -22%;
      transform: rotate(-6deg) translateY(45px);

      opacity: 0.55;
    }

    .wave.three {
      bottom: -28%;
      transform: rotate(6deg);

      opacity: 0.5;
    }

    .wave.four {
      bottom: -23%;
      transform: rotate(6deg) translateY(-40px);

      opacity: 0.3;
    }


    /* =========================
       CONTENITORE PRINCIPALE
    ========================= */

    .page {
      position: relative;
      z-index: 2;

      width: 100%;
      height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
    }


    /* =========================
       INTESTAZIONE
    ========================= */

    .header {
      margin-top: 32px;

      padding: 14px 30px;

      position: relative;

      font-family: "Manrope", sans-serif;

      letter-spacing: 0.08em;

        Bordo leggermente "ondulato"

      */
      border: 1px solid rgba(255, 255, 255, 0.10);

      border-radius: 18px;

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .header::before {
      content: "";

      position: absolute;

      inset: -3px;

      border-radius: 21px;

      border: 1px solid rgba(255, 255, 255, 0.025);

      pointer-events: none;
    }


    /* =========================
       FRASE CENTRALE
    ========================= */

    .quote-container {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: min(1000px, 86vw);

      text-align: center;
    }

    .quote {
      font-family: "Manrope", sans-serif;

      font-size: clamp(2.2rem, 5vw, 5rem);

      font-weight: 500;

      line-height: 1.08;

      letter-spacing: -0.055em;

      color: #ffffff;

      text-shadow:
        0 0 35px rgba(255, 255, 255, 0.06),
        0 10px 50px rgba(0, 0, 0, 0.30);

      /*
        Piccola animazione all'apparizione
      */
      animation: appear 1s ease-out;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* =========================
       ERRORE LETTURA FILE
    ========================= */

    .error {
      font-size: 0.9rem;

      color: rgba(255, 255, 255, 0.45);

       INSTAGRAM

      display: flex;
      align-items: center;

      width: 48px;

      color: white;

      background: rgba(255, 255, 255, 0.055);

      border: 1px solid rgba(255, 255, 255, 0.10);

      text-decoration: none;

      backdrop-filter: blur(10px);

      box-shadow:

      transition:

        background 0.25s ease,

    .instagram:hover {
      transform: translateY(-4px);

      background: rgba(255, 255, 255, 0.10);

      border-color: rgba(255, 255, 255, 0.20);
    }

    .instagram:active {
      transform: translateY(-1px);
    }


    /* =========================
       MOBILE

    @media (max-width: 600px) {

        margin-top: 24px;

        padding: 12px 20px;

      .quote-container {
        width: 88vw;

        bottom: 24px;

      }
    }

  </style>

  <!-- =========================
       SFONDO

  <div class="background-glow">

  <!-- =========================

  <main class="page">

    <!-- INTESTAZIONE -->

    <header class="header">
      here is what I'm telling you
    </header>

    <section class="quote-container">

      </div>

  <!-- =========================
       LETTURA FRASE
  ========================== -->

  <script>

    fetch("frase1.txt")

      .then(response => {

        if (!response.ok) {
          throw new Error("File frase1.txt non trovato");
        }

        return response.text();

      })

      .then(text => {

        const quote = document.getElementById("quote");

        /*
          Rimuove eventuali spazi o righe vuote
          all'inizio e alla fine del file.
        */

        const cleanText = text.trim();

        if (cleanText.length === 0) {
          quote.textContent = "Il file frase1.txt è vuoto.";
          return;
        }

        quote.textContent = cleanText;

      })

      .catch(error => {

        console.error(error);

        document.getElementById("quote").innerHTML =
          '<span class="error">Impossibile caricare la frase.</span>';

      });

  </script>
