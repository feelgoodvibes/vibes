<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Frase</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: #050505;
      color: white;
      font-family: 'Inter', sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
    }

    /* Onde dello sfondo */
    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 80vw;
      height: 80vw;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(100px);
    }

    body::before {
      top: -45vw;
      left: -20vw;
      background: rgba(255, 255, 255, 0.035);
    }

    body::after {
      bottom: -50vw;
      right: -20vw;
      background: rgba(120, 120, 120, 0.045);
    }

    /* Onde morbide */
    .wave {
      position: absolute;
      width: 140%;
      height: 55%;
      left: -20%;
      border-radius: 50%;
      border-top: 1px solid rgba(255, 255, 255, 0.035);
      transform: rotate(-7deg);
      pointer-events: none;
    }

    .wave:nth-child(1) {
      top: -25%;
      opacity: 0.8;
    }

    .wave:nth-child(2) {
      top: -20%;
      opacity: 0.5;
      transform: rotate(-7deg) translateY(35px);
    }

    .wave:nth-child(3) {
      bottom: -28%;
      opacity: 0.6;
      transform: rotate(7deg);
    }

    /* Testo */
    .quote {
      position: relative;
      z-index: 10;

      width: min(900px, 85vw);

      text-align: center;

      font-size: clamp(2rem, 4.5vw, 4.5rem);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.045em;

      text-wrap: balance;

      text-shadow: 0 0 40px rgba(255, 255, 255, 0.08);
    }
  </style>
</head>

<body>

  <div class="wave"></div>
  <div class="wave"></div>
  <div class="wave"></div>

  <!-- ✏️ CAMBIA QUI LA FRASE -->
  <div class="quote">
    La semplicità è la massima sofisticazione.
  </div>

</body>
</html>
