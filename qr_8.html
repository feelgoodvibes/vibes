<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Here is what I'm telling you</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            background: #111214;
            color: white;
            font-family: "Manrope", sans-serif;
        }

        /* SFONDO */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.07;
        }

        .glow.one {
            top: -300px;
            left: -200px;
            background: white;
        }

        .glow.two {
            right: -300px;
            bottom: -300px;
            background: #777;
        }

        .wave {
            position: absolute;
            width: 160%;
            height: 500px;
            left: -30%;
            border-radius: 50%;
            border-top: 1px solid rgba(255,255,255,0.025);
        }

        .wave.one {
            top: -300px;
            transform: rotate(-6deg);
        }

        .wave.two {
            top: -220px;
            transform: rotate(-6deg);
        }

        .wave.three {
            bottom: -350px;
            transform: rotate(6deg);
        }


        /* PAGINA */

        .page {
            position: relative;
            width: 100%;
            height: 100vh;
        }


        /* HEADER */

        .header {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 90px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(25, 26, 28, 0.8);

            border-bottom: 1px solid rgba(255,255,255,0.08);

            box-shadow: 0 15px 50px rgba(0,0,0,0.3);

            backdrop-filter: blur(15px);

            font-size: 14px;
            letter-spacing: 0.12em;

            color: rgba(255,255,255,0.75);
        }


        /* FRASE */

        .phrase-container {

            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 94vw;

            text-align: center;
        }

        #phrase {

            font-size: 90px;

            font-weight: 500;

            line-height: 1.08;

            letter-spacing: -0.055em;

            text-shadow:
                0 0 35px rgba(255,255,255,0.05),
                0 15px 50px rgba(0,0,0,0.3);

            opacity: 0;

            transition: opacity 0.5s ease;
        }

        #phrase.show {
            opacity: 1;
        }

        .line {
            display: block;
            white-space: nowrap;
        }


        /* INSTAGRAM */

        .instagram {

            position: absolute;

            left: 50%;
            bottom: 30px;

            transform: translateX(-50%);

            width: 48px;
            height: 48px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            text-decoration: none;

            background: rgba(255,255,255,0.05);

            border: 1px solid rgba(255,255,255,0.1);

            font-size: 20px;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .header {
                height: 75px;
                font-size: 11px;
            }

            #phrase {
                font-size: 54px;
            }

            .instagram {
                bottom: 22px;
                width: 46px;
                height: 46px;
            }

        }

    </style>
</head>


<body>

    <div class="background">

        <div class="glow one"></div>
        <div class="glow two"></div>

        <div class="wave one"></div>
        <div class="wave two"></div>
        <div class="wave three"></div>

    </div>


    <main class="page">

        <header class="header">
            here is what I'm telling you
        </header>


        <div class="phrase-container">

            <div id="phrase"></div>

        </div>


        <a
            class="instagram"
            href="https://www.instagram.com/nomeutente"
            target="_blank"
            rel="noopener noreferrer"
        >
            ◎
        </a>

    </main>


<script>

    /*
        FILE DELLA FRASE

        Per qr_1.html:
        frase1.txt

        Per qr_2.html:
        frase2.txt

        ecc.
    */

    const FILE_FRASE = "frase8.txt";


    /*
        LEGGE IL FILE
    */

    fetch(FILE_FRASE)
        .then(response => {

            if (!response.ok) {
                throw new Error("Impossibile leggere " + FILE_FRASE);
            }

            return response.text();

        })

        .then(testo => {

            mostraFrase(testo);

        })

        .catch(errore => {

            console.error(errore);

        });


    /*
        MOSTRA LA FRASE
    */

    function mostraFrase(testo) {

        testo = testo.trim();

        const contenitore = document.getElementById("phrase");

        /*
            <br> decide dove andare a capo.
        */

        const righe = testo.split("<br>");


        contenitore.innerHTML = "";


        righe.forEach(riga => {

            const elemento = document.createElement("span");

            elemento.className = "line";

            elemento.textContent = riga.trim();

            contenitore.appendChild(elemento);

        });


        adattaFont();

        contenitore.classList.add("show");

    }


    /*
        ADATTA AUTOMATICAMENTE IL FONT
        ALLA RIGA PIÙ LUNGA
    */

    function adattaFont() {

        const contenitore = document.getElementById("phrase");

        const righe = contenitore.querySelectorAll(".line");

        let dimensione = window.innerWidth <= 600 ? 54 : 90;

        const minimo = window.innerWidth <= 600 ? 20 : 30;

        const larghezzaMassima = window.innerWidth * 0.88;


        contenitore.style.fontSize = dimensione + "px";


        while (dimensione > minimo) {

            let troppoLunga = false;


            righe.forEach(riga => {

                if (riga.scrollWidth > larghezzaMassima) {

                    troppoLunga = true;

                }

            });


            if (!troppoLunga) {
                break;
            }


            dimensione--;

            contenitore.style.fontSize = dimensione + "px";

        }

    }


    window.addEventListener("resize", adattaFont);

</script>

</body>
</html>
